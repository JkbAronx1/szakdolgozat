<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés - Receptmegosztó</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; color: #e67e22; margin-bottom: 25px; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: #555; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; font-family: 'Poppins', sans-serif; }
        .input-group input:focus { border-color: #f39c12; outline: none; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; font-family: 'Poppins', sans-serif; margin-top: 10px; box-shadow: 0 4px 0 #e3896b; transition: all 0.1s ease; }
        button:active { transform: translateY(4px); box-shadow: 0 0px 0 #e3896b; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; }
        .link a { color: #e67e22; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Bejelentkezés</h2>

    <form action="/api/login" method="POST">
        <div class="input-group">
            <label>Email cím</label>
            <input type="email" name="email" placeholder="email" required>
        </div>
        <div class="input-group">
            <label>Jelszó</label>
            <input type="password" name="password" placeholder="jelszó" required>
        </div>
        <button type="submit">Belépés</button>
    </form>

    <div class="link">
        Még nincs fiókod? <a href="regisztracio.html">Regisztrálj itt!</a>
    </div>
</div>

</body>
</html>
