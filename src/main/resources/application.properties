spring.application.name=receptmegoszto

# MySQL adatbázis kapcsolat beállításai
spring.datasource.url=jdbc:mysql://localhost:3306/regisztracio?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=alma
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

